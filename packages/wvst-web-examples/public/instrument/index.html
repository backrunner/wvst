<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WVST Instrument</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="importmap">
      {
        "imports": {
          "@wvst/web": "/packages/wvst-web/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <aside>
        <h1>WVST Instrument</h1>
        <label>Bridge endpoint <input id="endpoint" value="ws://127.0.0.1:35876" /></label>
        <label>Token <input id="token" autocomplete="off" /></label>
        <div class="actions">
          <button id="connect">Connect</button>
          <button id="rescan" disabled>Rescan</button>
        </div>
        <div id="status" class="status">Idle</div>

        <h2>Plugin</h2>
        <label>Plugin <select id="plugin"></select></label>
        <label>Class <select id="class"></select></label>
        <div class="row">
          <label>Output channels <input id="outputs" type="number" min="1" max="8" value="2" /></label>
          <label>Frames <input id="frames" type="number" min="32" max="2048" step="32" value="128" /></label>
        </div>
        <label>Output <select id="output-device"></select></label>
        <div class="actions">
          <button id="mount" disabled>Mount</button>
          <button id="web-midi" disabled>Web MIDI</button>
          <button id="stop" disabled>Stop</button>
        </div>
      </aside>

      <section>
        <div class="grid">
          <div class="panel">
            <h2>Keyboard</h2>
            <div id="keyboard" class="keyboard"></div>
          </div>
          <div class="panel">
            <h2>Metrics</h2>
            <div id="metrics"></div>
          </div>
          <div class="panel">
            <h2>Runtime</h2>
            <pre id="runtime">{}</pre>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/packages/wvst-web-examples/dist/instrument/main.js"></script>
  </body>
</html>
