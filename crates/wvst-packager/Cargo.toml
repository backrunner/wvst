[package]
name = "wvst-packager"
description = "Release bundle generator for WVST bridge deployments."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wvst-packager"
path = "src/main.rs"

[[bin]]
name = "wvst-release"
path = "src/bin/wvst-release.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml_edit = "0.22"
sha2 = "0.10"
wvst-core = { path = "../wvst-core" }
wvst-protocol = { path = "../wvst-protocol" }

[lints]
workspace = true
