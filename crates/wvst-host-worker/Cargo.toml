[package]
name = "wvst-host-worker"
description = "Isolated WVST host worker process entrypoint."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wvst-core = { path = "../wvst-core" }
wvst-protocol = { path = "../wvst-protocol" }
wvst-scanner = { path = "../wvst-scanner" }
wvst-shm-mmap = { path = "../wvst-shm-mmap" }
wvst-shm-transport = { path = "../wvst-shm-transport" }
wvst-vst3-host = { path = "../wvst-vst3-host" }

[[bin]]
name = "wvst-host-worker"
path = "src/main.rs"

[lints]
workspace = true
