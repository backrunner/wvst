[package]
name = "wvst-bridge-server"
description = "Local WVST bridge server with a WebSocket control and audio echo endpoint."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
url = "2"
wvst-core = { path = "../wvst-core" }
wvst-protocol = { path = "../wvst-protocol" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "wvst-bridge-server"
path = "src/main.rs"

[lints]
workspace = true

