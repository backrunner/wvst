name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Check Web WASM crate
        run: RUSTC="$(rustup which rustc)" cargo check -p wvst-web-wasm --target wasm32-unknown-unknown

  web:
    name: Web SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Web SDK
        run: npm run check:web

      - name: Test Web SDK
        run: npm run test:web

      - name: Build Web SDK
        run: npm run build:web

      - name: Type-check Web examples
        run: npm --workspace @wvst/web-examples run check

      - name: Build Web examples
        run: npm --workspace @wvst/web-examples run build
