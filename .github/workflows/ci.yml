name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check product version consistency
        run: cargo run --quiet --locked -p wvst-packager --bin wvst-release -- check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Check Web WASM crate
        run: RUSTC="$(rustup which rustc)" cargo check -p wvst-web-wasm --target wasm32-unknown-unknown

  rust-platform:
    name: Rust platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Check product version consistency
        run: cargo run --quiet --locked -p wvst-packager --bin wvst-release -- check

      - name: Run Rust tests
        run: cargo test --workspace

  web:
    name: Web SDK and Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Web SDK
        run: npm run check:web

      - name: Test Web SDK
        run: npm run test:web

      - name: Build Web SDK
        run: npm run build:web

      - name: Type-check Web examples
        run: npm --workspace @wvst/web-examples run check

      - name: Build Web examples
        run: npm --workspace @wvst/web-examples run build

      - name: Check documentation
        run: npm --workspace @wvst/docs run check

      - name: Build documentation
        run: npm --workspace @wvst/docs run build -- --no-og
