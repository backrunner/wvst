name: WVST Evidence Gates

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label with the required plugins, browser metrics, package artifacts, or OS install state.
        required: true
        default: self-hosted
      runtime_matrix_manifest:
        description: Path to a runtime-probe matrix manifest on the runner.
        required: false
      host_worker:
        description: Path to wvst-host-worker. Defaults to target/release/wvst-host-worker after build.
        required: false
      latency_snapshot:
        description: Path to latency snapshot JSON.
        required: false
      stability_budget:
        description: Path to stability budget JSON.
        required: false
      webaudio_metrics:
        description: Optional WebAudio metrics JSON.
        required: false
      bridge_metrics:
        description: Optional Bridge metrics JSON.
        required: false
      package_manifest:
        description: Path to wvst-package-manifest.json.
        required: false
      package_verify_report:
        description: Path to wvst-verify-report.json.
        required: false
      package_budget:
        description: Optional package evidence budget JSON.
        required: false
      browser_smoke:
        description: Run the configurable browser WebAudio smoke and upload its report.
        required: false
        type: boolean
        default: false
      browser_smoke_duration_ms:
        description: Browser smoke collection duration in milliseconds.
        required: false
        default: "1800000"
      browser_smoke_min_round_trips:
        description: Minimum browser smoke round-trip samples.
        required: false
        default: "1000"
      bridge_web_smoke:
        description: Run the configurable browser-to-Bridge-to-VST3 smoke and upload its report.
        required: false
        type: boolean
        default: false
      bridge_web_smoke_plugin_path:
        description: VST3 bundle path for the browser-to-Bridge smoke.
        required: false
      bridge_web_smoke_class_id:
        description: Optional VST3 class id for the browser-to-Bridge smoke.
        required: false
      bridge_web_smoke_input_channels:
        description: Input channel count for the browser-to-Bridge smoke.
        required: false
        default: "2"
      bridge_web_smoke_output_channels:
        description: Output channel count for the browser-to-Bridge smoke.
        required: false
        default: "2"
      bridge_web_smoke_input_bus_index:
        description: Optional VST3 input bus index for the browser-to-Bridge smoke.
        required: false
      bridge_web_smoke_output_bus_index:
        description: Optional VST3 output bus index for the browser-to-Bridge smoke.
        required: false
      bridge_web_smoke_duration_ms:
        description: Browser-to-Bridge smoke collection duration in milliseconds.
        required: false
        default: "1800000"
      bridge_web_smoke_min_round_trips:
        description: Minimum browser-to-Bridge smoke round-trip samples.
        required: false
        default: "1000"

jobs:
  evidence:
    name: Evidence
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Build evidence binaries
        run: cargo build --workspace --bins --release

      - name: Set up Node.js for browser evidence
        if: ${{ inputs.browser_smoke || inputs.bridge_web_smoke }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser evidence dependencies
        if: ${{ inputs.browser_smoke || inputs.bridge_web_smoke }}
        run: npm ci

      - name: Install browser evidence runtime
        if: ${{ inputs.browser_smoke || inputs.bridge_web_smoke }}
        run: npx playwright install chromium

      - name: Run evidence gates
        env:
          RUNTIME_MATRIX_MANIFEST: ${{ inputs.runtime_matrix_manifest }}
          HOST_WORKER: ${{ inputs.host_worker }}
          LATENCY_SNAPSHOT: ${{ inputs.latency_snapshot }}
          STABILITY_BUDGET: ${{ inputs.stability_budget }}
          WEBAUDIO_METRICS: ${{ inputs.webaudio_metrics }}
          BRIDGE_METRICS: ${{ inputs.bridge_metrics }}
          PACKAGE_MANIFEST: ${{ inputs.package_manifest }}
          PACKAGE_VERIFY_REPORT: ${{ inputs.package_verify_report }}
          PACKAGE_BUDGET: ${{ inputs.package_budget }}
          BROWSER_SMOKE: ${{ inputs.browser_smoke }}
          BROWSER_SMOKE_DURATION_MS: ${{ inputs.browser_smoke_duration_ms }}
          BROWSER_SMOKE_MIN_ROUND_TRIPS: ${{ inputs.browser_smoke_min_round_trips }}
          BRIDGE_WEB_SMOKE: ${{ inputs.bridge_web_smoke }}
          BRIDGE_WEB_SMOKE_PLUGIN_PATH: ${{ inputs.bridge_web_smoke_plugin_path }}
          BRIDGE_WEB_SMOKE_CLASS_ID: ${{ inputs.bridge_web_smoke_class_id }}
          BRIDGE_WEB_SMOKE_INPUT_CHANNELS: ${{ inputs.bridge_web_smoke_input_channels }}
          BRIDGE_WEB_SMOKE_OUTPUT_CHANNELS: ${{ inputs.bridge_web_smoke_output_channels }}
          BRIDGE_WEB_SMOKE_INPUT_BUS_INDEX: ${{ inputs.bridge_web_smoke_input_bus_index }}
          BRIDGE_WEB_SMOKE_OUTPUT_BUS_INDEX: ${{ inputs.bridge_web_smoke_output_bus_index }}
          BRIDGE_WEB_SMOKE_DURATION_MS: ${{ inputs.bridge_web_smoke_duration_ms }}
          BRIDGE_WEB_SMOKE_MIN_ROUND_TRIPS: ${{ inputs.bridge_web_smoke_min_round_trips }}
        run: |
          set -euo pipefail
          mkdir -p evidence

          ran_gate=0

          if [ "${BROWSER_SMOKE}" = "true" ]; then
            WVST_BROWSER_SMOKE_REPORT=evidence/browser-smoke.json \
            WVST_BROWSER_SMOKE_DURATION_MS="${BROWSER_SMOKE_DURATION_MS}" \
            WVST_BROWSER_SMOKE_MIN_ROUND_TRIPS="${BROWSER_SMOKE_MIN_ROUND_TRIPS}" \
              npm run smoke:browser:web
            ran_gate=1
          fi

          if [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
            if [ -z "${BRIDGE_WEB_SMOKE_PLUGIN_PATH}" ]; then
              echo "bridge_web_smoke_plugin_path is required when bridge_web_smoke is true" >&2
              exit 2
            fi
            WVST_BRIDGE_SERVER=target/release/wvst-bridge-server \
            WVST_HOST_WORKER=target/release/wvst-host-worker \
            WVST_BRIDGE_SMOKE_REPORT=evidence/web-bridge-smoke.json \
            WVST_BRIDGE_SMOKE_PLUGIN_PATH="${BRIDGE_WEB_SMOKE_PLUGIN_PATH}" \
            WVST_BRIDGE_SMOKE_CLASS_ID="${BRIDGE_WEB_SMOKE_CLASS_ID}" \
            WVST_BRIDGE_SMOKE_INPUT_CHANNELS="${BRIDGE_WEB_SMOKE_INPUT_CHANNELS}" \
            WVST_BRIDGE_SMOKE_OUTPUT_CHANNELS="${BRIDGE_WEB_SMOKE_OUTPUT_CHANNELS}" \
            WVST_BRIDGE_SMOKE_INPUT_BUS_INDEX="${BRIDGE_WEB_SMOKE_INPUT_BUS_INDEX}" \
            WVST_BRIDGE_SMOKE_OUTPUT_BUS_INDEX="${BRIDGE_WEB_SMOKE_OUTPUT_BUS_INDEX}" \
            WVST_BRIDGE_SMOKE_DURATION_MS="${BRIDGE_WEB_SMOKE_DURATION_MS}" \
            WVST_BRIDGE_SMOKE_MIN_ROUND_TRIPS="${BRIDGE_WEB_SMOKE_MIN_ROUND_TRIPS}" \
              npm run smoke:bridge:web
            ran_gate=1
          fi

          if [ -n "${RUNTIME_MATRIX_MANIFEST}" ]; then
            worker="${HOST_WORKER:-target/release/wvst-host-worker}"
            cargo run -p wvst-testkit --bin wvst-runtime-matrix --release -- \
              --worker "${worker}" \
              --manifest "${RUNTIME_MATRIX_MANIFEST}" \
              | tee evidence/runtime-matrix-report.json
            ran_gate=1
          fi

          if [ -n "${LATENCY_SNAPSHOT}" ] || [ -n "${STABILITY_BUDGET}" ] || [ -n "${WEBAUDIO_METRICS}" ] || [ -n "${BRIDGE_METRICS}" ] || [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
            latency_snapshot="${LATENCY_SNAPSHOT}"
            if [ -z "${latency_snapshot}" ] && [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
              latency_snapshot="evidence/web-bridge-smoke.json"
            fi
            stability_budget="${STABILITY_BUDGET}"
            if [ -z "${stability_budget}" ] && [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
              stability_budget="evidence/bridge-web-smoke-budget.json"
              cat > "${stability_budget}" <<'JSON'
          {
            "minRunDurationMillis": 1800000,
            "minObservations": 1000,
            "maxDroppedFrames": 0,
            "maxTimeoutFrames": 0,
            "maxLateFrames": 0,
            "maxProcessErrorFrames": 0,
            "maxRouteLatencyP95Us": 1000,
            "maxRoundTripP95Us": 10000,
            "maxWebAudioUnderflows": 10,
            "maxWebAudioOverflows": 0,
            "maxWebAudioDroppedInputQuanta": 0,
            "maxWebAudioDroppedOutputQuanta": 0,
            "maxWebAudioTransportFailures": 0,
            "maxWebAudioEndToEndRoundTripP95Us": 10000,
            "maxPendingInputQuanta": 0,
            "maxPendingOutputQuanta": 8,
            "minBridgeAudioFramesRouted": 1000,
            "maxBridgeAudioBackpressureDrops": 0,
            "maxBridgeAudioFrameRouteFailures": 0,
            "maxBridgeAudioSequenceGapEvents": 0,
            "maxBridgeAudioSequenceGapFrames": 0,
            "maxBridgeAudioFramesDuplicate": 0,
            "maxBridgeAudioFramesOutOfOrder": 0,
            "maxBridgeAudioFramesLate": 0,
            "maxBridgeAudioRouteLatencyP95Us": 1000,
            "maxBridgeAudioInterarrivalJitterP99Us": 10000
          }
          JSON
            fi
            if [ -z "${latency_snapshot}" ] || [ -z "${stability_budget}" ]; then
              echo "latency_snapshot and stability_budget are required for the stability gate" >&2
              exit 2
            fi
            args=(--snapshot "${latency_snapshot}" --budget "${stability_budget}")
            webaudio_metrics="${WEBAUDIO_METRICS}"
            if [ -z "${webaudio_metrics}" ] && [ "${BROWSER_SMOKE}" = "true" ]; then
              webaudio_metrics="evidence/browser-smoke.json"
            fi
            if [ -z "${webaudio_metrics}" ] && [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
              webaudio_metrics="evidence/web-bridge-smoke.json"
            fi
            if [ -n "${webaudio_metrics}" ]; then
              args+=(--webaudio "${webaudio_metrics}")
            fi
            bridge_metrics="${BRIDGE_METRICS}"
            if [ -z "${bridge_metrics}" ] && [ "${BRIDGE_WEB_SMOKE}" = "true" ]; then
              bridge_metrics="evidence/web-bridge-smoke.json"
            fi
            if [ -n "${bridge_metrics}" ]; then
              args+=(--bridge "${bridge_metrics}")
            fi
            cargo run -p wvst-testkit --bin wvst-stability-budget --release -- "${args[@]}" \
              | tee evidence/stability-budget-report.json
            ran_gate=1
          fi

          if [ -n "${PACKAGE_MANIFEST}" ] || [ -n "${PACKAGE_VERIFY_REPORT}" ] || [ -n "${PACKAGE_BUDGET}" ]; then
            if [ -z "${PACKAGE_MANIFEST}" ] || [ -z "${PACKAGE_VERIFY_REPORT}" ]; then
              echo "package_manifest and package_verify_report are required for the package evidence gate" >&2
              exit 2
            fi
            args=(--manifest "${PACKAGE_MANIFEST}" --verify-report "${PACKAGE_VERIFY_REPORT}")
            if [ -n "${PACKAGE_BUDGET}" ]; then
              args+=(--budget "${PACKAGE_BUDGET}")
            else
              args+=(--strict-release)
            fi
            cargo run -p wvst-testkit --bin wvst-package-evidence --release -- "${args[@]}" \
              | tee evidence/package-evidence-report.json
            ran_gate=1
          fi

          if [ "${ran_gate}" -eq 0 ]; then
            echo "provide at least one evidence input group" >&2
            exit 2
          fi

      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wvst-evidence
          path: evidence/*.json
          if-no-files-found: ignore
